name: Embedded OpenSearch
permissions:
  contents: read
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/opensearch/**'
      - 'src/opensearch.ts'
      - 'src/dynamodb.ts'
      - 'src/cloudwatch-logs*.ts'
      - 'test/cloudwatch-opensearch-languages.test.ts'
      - 'src/auth/sigv4.ts'
      - 'src/sts.ts'
      - 'src/server.ts'
      - 'src/appsync/opensearch-resolver.ts'
      - 'src/cloudformation/providers/opensearch*.ts'
      - 'src/configuration-secrets/encrypted-material-store.ts'
      - 'examples/opensearch-producers/**'
      - 'test/opensearch-*.test.ts'
      - 'test/fixtures/opensearch-*.ts'
      - 'docs/opensearch-capabilities.json'
      - '.github/workflows/opensearch.yml'
jobs:
  focused-search:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ['22.13.0', '24']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npx --no-install tsc --noEmit
      - run: node --import tsx --test --test-concurrency=1 test/opensearch-encryption.test.ts test/opensearch-security.test.ts test/opensearch-phase03.test.ts test/opensearch-config-recovery.test.ts test/opensearch-workspace.test.ts test/opensearch-serverless.test.ts test/opensearch-serverless-cloudformation.test.ts test/opensearch-serverless-index.test.ts test/opensearch-serverless-lifecycle.test.ts test/opensearch-serverless-express.test.ts test/opensearch-ingestion-config.test.ts test/opensearch-ingestion-roles.test.ts test/opensearch-ingestion.test.ts test/opensearch-ingestion-cloudformation.test.ts test/opensearch-snapshot-engine.test.ts test/opensearch-snapshots.test.ts test/opensearch-snapshot-recovery.test.ts test/opensearch-maintenance.test.ts test/opensearch-maintenance-recovery.test.ts test/opensearch-logging.test.ts test/opensearch-ingestion-logging.test.ts test/opensearch-ingest-pipelines.test.ts test/opensearch-appsync.test.ts test/opensearch-query-languages.test.ts test/opensearch-hybrid.test.ts test/opensearch-audit.test.ts test/opensearch-ism.test.ts test/opensearch-analyzers.test.ts test/opensearch-packages.test.ts test/opensearch-package-recovery.test.ts test/opensearch-automatic-backups.test.ts test/opensearch-automatic-recovery.test.ts test/opensearch-insights.test.ts test/opensearch-producers.test.ts test/opensearch-ingestion-s3.test.ts test/opensearch-ingestion-s3-recovery.test.ts test/opensearch-versioning.test.ts test/opensearch-ingestion-dynamodb.test.ts test/opensearch-ingestion-dynamodb-recovery.test.ts test/opensearch-serverless-ingestion.test.ts test/opensearch-serverless-ingestion-recovery.test.ts test/opensearch-serverless-streams.test.ts test/opensearch-serverless-streams-recovery.test.ts test/opensearch-ingestion-dynamodb-export.test.ts test/opensearch-ingestion-dynamodb-export-recovery.test.ts test/cloudwatch-opensearch-languages.test.ts test/opensearch-direct-query.test.ts test/opensearch-direct-query-recovery.test.ts test/opensearch-connections.test.ts test/opensearch-comparison.test.ts test/opensearch-connection-recovery.test.ts test/opensearch-applications.test.ts test/opensearch-application-cloudformation.test.ts test/opensearch-application-recovery.test.ts
