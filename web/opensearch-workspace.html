<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="stacksim-region" content="{{REGION}}"><meta name="stacksim-internal-users" content="{{INTERNAL}}"><title>StackSim search workspace</title><link rel="stylesheet" href="/_stacksim/workspace-ui/styles.css"></head>
<body class="os-workspace-standalone"><main class="page-width"><header class="page-header"><div><h1>Search workspace</h1><p>Discover, saved searches and Dev Tools for this local domain.</p></div><button class="button" id="os-sign-out" hidden>Sign out</button></header><form id="os-workspace-login" class="card"><div class="card-body"><div class="alert info">Use this domain's internal credentials or IAM credentials. Credentials stay in this page's memory until you sign out or close it.</div><div role="alert" class="alert error" hidden tabindex="-1"></div><div class="field"><label for="os-auth-kind">Authentication</label><select id="os-auth-kind"><option value="iam">AWS Signature Version 4</option><option value="basic">Internal user</option></select></div><div class="field"><label for="os-login-name">Access key ID or username</label><input id="os-login-name" autocomplete="username" required></div><div class="field"><label for="os-login-secret">Secret access key or password</label><input id="os-login-secret" type="password" autocomplete="current-password" required></div><div class="field" id="os-token-field"><label for="os-login-token">Session token (optional)</label><input id="os-login-token" type="password" autocomplete="off"></div><button class="button primary" type="submit">Sign in</button></div></form><div id="os-workspace-content"></div></main><script type="module" src="/_stacksim/workspace-ui/entry.js"></script></body></html>
