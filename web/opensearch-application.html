<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="stacksim-region" content="{{REGION}}"><title>StackSim OpenSearch application</title><link rel="stylesheet" href="/styles.css"></head>
<body class="os-workspace-standalone"><main class="page-width"><header class="page-header"><div><h1>OpenSearch application</h1><p>Shared search workspaces and current access to associated data sources.</p></div><button class="button" id="os-app-sign-out" hidden>Sign out</button></header><form id="os-app-login" class="card"><div class="card-body"><p>Sign in with IAM credentials. Credentials stay in this page's memory until you sign out or close it.</p><div role="alert" class="alert error" tabindex="-1" hidden></div><div class="field"><label for="os-app-key">Access key ID</label><input id="os-app-key" autocomplete="username" required></div><div class="field"><label for="os-app-secret">Secret access key</label><input id="os-app-secret" type="password" autocomplete="current-password" required></div><div class="field"><label for="os-app-token">Session token (optional)</label><input id="os-app-token" type="password" autocomplete="off"></div><button class="button primary" type="submit">Sign in</button></div></form><div id="os-app-content"></div></main><script type="module" src="/application.js"></script></body></html>
